name: Correct an Atlas card
description: Report a wrong, outdated or missing fact on a card
title: "[Fix] "
labels: ["atlas", "correction"]
body:
  - type: input
    id: card
    attributes: {label: Card URL, placeholder: "https://commonworld.one/atlas/platforms/<slug>/"}
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes: {label: What is wrong}
    validations: {required: true}
  - type: textarea
    id: right
    attributes: {label: What is right, and the public source}
    validations: {required: true}
