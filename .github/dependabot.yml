# Weekly dependency update PRs (never auto-merged; CI runs on each).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /          # root requirements.txt
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
