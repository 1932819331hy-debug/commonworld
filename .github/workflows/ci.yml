name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust:
    # Commonworld trust engine (trust/, TRUST.md): unit tests with mocked sources + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
  atlas:
    # Bot-opened refresh PRs get CI via workflow_dispatch from refresh.yml instead (pull_request from GITHUB_TOKEN fails without secrets).
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Unit tests (refresh security, link safety)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Install CI-only tools (standard JSON Schema validator)
        run: |
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Fetch homepage screenshots (orphan branch atlas-screens)
        # images live only on that branch; build.py would fetch it too (and falls back to the public tarball)
        run: git fetch --depth=1 --no-tags origin +refs/heads/atlas-screens:refs/remotes/origin/atlas-screens
      - name: Build
        env:
          CW_SCREENS_REQUIRED: '1'   # CI must publish the previews; a local build without the branch shows placeholders
        run: python atlas/site/build.py
      - name: GitHub data mirror is up to date
        run: |
          if [ -n "$(git status --porcelain -- atlas/public)" ]; then
            git status --porcelain -- atlas/public | head -20
            echo "::error::atlas/public is stale: run python3 atlas/site/build.py and commit atlas/public"; exit 1
          fi
      - name: Check
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
          CW_SCREENS_REQUIRED: '1'
        run: |
          if [ -z "$CW_PRIVATE_TERMS" ]; then echo "::warning::secret CW_PRIVATE_TERMS not set, forbidden-text check skipped"; fi
          python atlas/site/check.py
      - name: API v1 files match their JSON Schemas (jsonschema, Draft 2020-12 + formats)
        run: python atlas/site/tools/validate_jsonschema.py atlas/site/dist/api/v1
      - name: Smoke (browser)
        env:
          SHOTS_DIR: atlas/site/screenshots/smoke
        run: |
          mkdir -p "$SHOTS_DIR"
          python atlas/site/tools/smoke_test.py
      - name: Smoke screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots
          path: atlas/site/screenshots/smoke/
          retention-days: 14
          if-no-files-found: ignore
