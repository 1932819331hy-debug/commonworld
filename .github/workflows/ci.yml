name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    # Bot-opened refresh PRs get CI via workflow_dispatch from refresh.yml instead (pull_request from GITHUB_TOKEN fails without secrets).
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build
        run: python atlas/site/build.py
      - name: Check
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
        run: |
          if [ -z "$CW_PRIVATE_TERMS" ]; then echo "::warning::secret CW_PRIVATE_TERMS not set, forbidden-text check skipped"; fi
          python atlas/site/check.py
      - name: Smoke (browser)
        run: python atlas/site/tools/smoke_test.py
